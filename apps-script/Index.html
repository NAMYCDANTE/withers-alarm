<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#0b6e8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 위더스 일정비서 - phone layout. (copied from the demo page)
   Layout: one phone-width column. Sticky header with two tabs (문자함 / 일정표).
   문자함 = incoming SMS list -> analysis sheet (verdict, day timeline, alternatives, reply draft). */
:root {
  --bg: #eef3f6;
  --surface: #ffffff;
  --surface-2: #e4ecf1;
  --line: #d3dee6;
  --fg: #13212b;
  --muted: #5a6b78;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --accent-soft: #d9eff5;
  --ok: #18774a;
  --ok-soft: #dcf3e6;
  --warn: #9a5800;
  --warn-soft: #fcebd0;
  --bad: #b42318;
  --bad-soft: #fde2de;
  --block: #9fb6c4;
  --grid: #e7eef2;
  --c-ac: #d3ecf4;
  --c-ac-ink: #074b5e;
  --c-home: #f7e2c6;
  --c-home-ink: #774100;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1418; --surface: #152027; --surface-2: #1c2a32; --line: #2a3b45;
    --fg: #e5eef3; --muted: #92a4b0; --accent: #4fb9d5; --accent-ink: #05252f; --accent-soft: #123540;
    --ok: #5fcb8f; --ok-soft: #133426; --warn: #e9ab4f; --warn-soft: #3a2a12; --bad: #f2806f; --bad-soft: #3e1b17;
    --block: #4b6676; --grid: #1e2b33; --c-ac: #123d49; --c-ac-ink: #a3deee; --c-home: #3e2c15; --c-home-ink: #f1c584; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1418; --surface: #152027; --surface-2: #1c2a32; --line: #2a3b45;
  --fg: #e5eef3; --muted: #92a4b0; --accent: #4fb9d5; --accent-ink: #05252f; --accent-soft: #123540;
  --ok: #5fcb8f; --ok-soft: #133426; --warn: #e9ab4f; --warn-soft: #3a2a12; --bad: #f2806f; --bad-soft: #3e1b17;
  --block: #4b6676; --grid: #1e2b33; --c-ac: #123d49; --c-ac-ink: #a3deee; --c-home: #3e2c15; --c-home-ink: #f1c584; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-ink); }
.top-inner { max-width: 560px; margin: 0 auto; padding-block: 14px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.brand .today { font-size: 13px; opacity: .85; }
.tabs { display: flex; gap: 4px; margin-top: 12px; }
.tab { flex: 1; border: 0; background: transparent; color: var(--accent-ink); opacity: .75; padding: 10px 8px 12px; font-weight: 600; border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--accent-ink); }
.tab .count { font-family: var(--mono); font-size: 12px; margin-left: 4px; }

main { max-width: 560px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.section-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.demo-note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin: 0; }

/* inbox */
.inbox { display: flex; flex-direction: column; gap: 10px; }
.sms { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.sms.is-active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.sms-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sms-from { font-weight: 600; font-family: var(--mono); font-size: 14px; }
.sms-time { font-size: 12px; color: var(--muted); }
.sms-body { margin: 0; font-size: 14px; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sms-cta { font-size: 13px; font-weight: 600; color: var(--accent); }
.pill { margin-left: auto; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill-new { background: var(--accent-soft); color: var(--accent); }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }

.paste { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.paste label { font-size: 13px; font-weight: 600; }
.paste textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 600; font-size: 14px; background: var(--surface-2); color: var(--fg); text-decoration: none; text-align: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-grow { flex: 1; }
.btn:disabled { opacity: .5; cursor: default; }

/* result sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.sheet-empty { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 14px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--bad-soft); color: var(--bad); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert-icon { flex: none; width: 22px; height: 22px; }
.alert-title { font-weight: 700; font-size: 15px; }
.alert-text { font-size: 13px; color: var(--fg); margin-top: 2px; }
.sheet-body { padding: 14px; display: flex; flex-direction: column; gap: 16px; }
.quote { margin: 0; font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.fields { display: grid; grid-template-columns: 88px 1fr; gap: 8px 12px; align-items: center; margin: 0; }
.fields dt { font-size: 13px; color: var(--muted); }
.fields dd { margin: 0; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.fields input, .fields select { width: 100%; max-width: 220px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); }
.missing { color: var(--warn); }

.conflict-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.conflict-list li { font-size: 14px; background: var(--bad-soft); border-radius: 8px; padding: 8px 10px; }

/* week calendar */
.wk { --hr: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.wk-head, .wk-body { display: grid; }
.wk-head { border-bottom: 1px solid var(--line); }
.wk-dh { text-align: center; padding: 6px 0 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.wk-dh b { display: block; width: 28px; height: 28px; line-height: 28px; margin: 1px auto 0; border-radius: 999px; font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--fg); }
.wk-dh.is-today b { background: var(--accent); color: var(--accent-ink); }
.wk-dh.is-past { opacity: .55; }
.wk-n { display: block; font-size: 10px; font-weight: 600; color: var(--accent); }
.wk-body { padding-top: 6px; padding-bottom: 6px; }
.wk-axis { position: relative; height: calc(var(--hr) * var(--hours, 11)); }
.wk-axis span { position: absolute; right: 4px; transform: translateY(-50%); font-family: var(--mono); font-size: 10px; color: var(--muted); }
.wk-col { position: relative; height: calc(var(--hr) * var(--hours, 11)); border-left: 1px solid var(--line); min-width: 0;
  background-image: repeating-linear-gradient(to bottom, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent var(--hr)); }
.wk-col.is-past, .wk-col.is-off { background-color: var(--surface-2); }
.wk-col.pickable { cursor: pointer; }
.ev { position: absolute; left: 2px; right: 2px; z-index: 1; display: flex; flex-direction: column; gap: 0; overflow: hidden; text-align: left;
  border: 0; border-left: 3px solid var(--accent); border-radius: 5px; padding: 2px 2px 2px 3px; font-size: 11px; letter-spacing: -0.02em; line-height: 1.25;
  background: var(--c-ac); color: var(--c-ac-ink); }
.ev.home { background: var(--c-home); color: var(--c-home-ink); border-left-color: var(--c-home-ink); }
.ev-t { font-family: var(--mono); font-size: 10px; opacity: .85; }
.ev-n { font-weight: 700; white-space: nowrap; overflow: hidden; }
.ev-l { overflow: hidden; word-break: keep-all; }
.sheet .wk { margin: 0 -14px; border-radius: 0; border-left: 0; border-right: 0; }
.ev.is-sel { box-shadow: 0 0 0 2px var(--fg); }
.ev.hit { box-shadow: 0 0 0 2px var(--bad); }
.ev.prop { z-index: 2; pointer-events: none; border: 2px dashed var(--ok); background: color-mix(in srgb, var(--ok) 20%, var(--surface)); color: var(--ok); }
.ev.prop.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, var(--surface)); color: var(--bad); }
.wk-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 3; pointer-events: none; }
.legend { display: flex; gap: 6px 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.alts { display: flex; flex-direction: column; gap: 8px; }
.alt { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.alt[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); }
.alt-date { font-weight: 600; }
.alt-why { font-size: 12px; color: var(--muted); }
.alt-mark { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); }
.alt[aria-pressed="true"] .alt-mark { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 3px var(--ok-soft); }

.reply { width: 100%; min-height: 128px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); font-size: 14px; resize: vertical; }
.phone-line { font-size: 13px; color: var(--muted); }
.done-banner { background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: 14px; }

/* schedule */
.sched-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--mono); font-size: 22px; font-weight: 600; }
.stat span { font-size: 12px; color: var(--muted); }
/* schedule tab */
.wk-nav { display: flex; align-items: center; gap: 8px; }
.wk-range { flex: 1; text-align: center; font-weight: 700; font-size: 16px; }
.wk-range small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.wk-btn { flex: none; width: 44px; height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 20px; line-height: 1; }
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.detail-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.detail-when { font-weight: 700; }
.job-who { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.job-del { border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; padding: 5px 10px; border-radius: 8px; }
.job-del.armed { color: var(--bad); background: var(--bad-soft); border-color: transparent; font-weight: 600; }
.foot { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

.howto { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.howto h2 { font-size: 16px; margin: 0 0 10px; }
.howto ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.howto li span { color: var(--muted); font-size: 13px; display: block; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .sheet.fresh { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* app-only additions */
html { -webkit-tap-highlight-color: transparent; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
.refresh { border: 1px solid color-mix(in srgb, var(--accent-ink) 45%, transparent); background: transparent; color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.sms.is-done { opacity: .7; }
.fields input[type="text"], .fields input[type="tel"] { max-width: 100%; }
.howto .btn { font-size: 13px; padding: 8px 12px; }
.phone-line a { color: var(--accent); font-weight: 600; }
.detail a { color: var(--accent); }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>위더스 일정비서</h1>
      <button type="button" class="refresh" id="refreshBtn" aria-label="새로고침">새로고침</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-inbox" aria-selected="true" data-view="inbox">문의<span class="count" id="inboxCount"></span></button>
      <button class="tab" role="tab" id="tab-sched" aria-selected="false" data-view="sched">일정표<span class="count" id="jobCount"></span></button>
    </div>
  </div>
</header>

<main>
  <section id="view-inbox" class="view">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div>
        <p class="section-label">들어온 문의 <span id="todayLabel" style="font-weight:500;letter-spacing:0"></span></p>
        <div class="inbox" id="inbox"></div>
      </div>

      <form class="paste" id="pasteForm">
        <label for="pasteText">전화로 받은 예약이나 문자 직접 넣기</label>
        <textarea id="pasteText" placeholder="예) 12월 3일 오후 2시 벽걸이 2대 김철수 010-1234-5678 마포구 공덕동 래미안 101동"></textarea>
        <div class="row"><button class="btn btn-primary btn-grow" type="submit" id="pasteBtn">일정 확인하기</button></div>
      </form>

      <div id="resultAnchor">
        <p class="section-label">확인 결과</p>
        <div class="sheet" id="result"><div class="sheet-empty">문의를 누르면 날짜·시간·작업을 읽고<br>일정표와 겹치는지 알려줘요.</div></div>
      </div>

      <div class="howto" id="settings"></div>
    </div>
  </section>

  <section id="view-sched" class="view" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="wk-nav">
        <button type="button" class="wk-btn" id="wkPrev" aria-label="지난 주">‹</button>
        <div class="wk-range"><span id="wkRange"></span><small id="wkSub"></small></div>
        <button type="button" class="wk-btn" id="wkNext" aria-label="다음 주">›</button>
      </div>
      <div class="sched-summary" id="schedSummary"></div>
      <div id="wkGrid"></div>
      <div class="legend"><span><i style="background:var(--c-ac)"></i>에어컨 청소</span><span><i style="background:var(--c-home)"></i>집 청소</span><span><i style="background:var(--bad);height:2px;vertical-align:3px"></i>지금</span><span>휴무일은 일정이 있을 때만 보여요</span></div>
      <div id="wkDetail"></div>
      <div class="foot"><button class="btn" id="wkToday" type="button">이번 주로</button></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script>
var KEY = "<?= key ?>";
var APP_URL = "<?= appUrl ?>";
var CFG = <?!= cfgJson ?>;
var L = (<?!= logicSrc ?>)(CFG);
var state = <?!= bootJson ?>;
</script>
<script>
(function () {
  "use strict";
  var DOW = L.DOW, OPEN = L.OPEN, CLOSE = L.CLOSE, FULL_START = L.FULL_START, FULL_DUR = L.FULL_DUR, HR = 44;
  var key = L.key, fromKey = L.fromKey, addDays = L.addDays, hm = L.hm, fmtDate = L.fmtDate, fmtTime = L.fmtTime, fmtDur = L.fmtDur, whenText = L.whenText, shortLabel = L.shortLabel;
  function now() { return new Date(); }
  function today0() { return L.day0(now()); }
  function tkey() { return key(today0()); }
  function dayJobs(k) { return L.jobsOn(state.jobs, k); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var $ = function (id) { return document.getElementById(id); };

  // ---------- 서버 호출 ----------
  var busy = false;
  function run(fn) {
    var args = [KEY].concat([].slice.call(arguments, 1));
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { toast((e && e.message) || "연결이 안 돼요. 잠시 뒤 다시 해 주세요."); reject(e); })[fn].apply(null, args);
    });
  }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2400);
  }

  // ---------- 문의 목록 ----------
  var cur = null, ev = null, sel = null, added = false, armedDel = null, armedDismiss = false;

  function itemPill(m) {
    if (m.status === "done") return { tone: "ok", text: "일정 등록됨" };
    if (!m.parsed) return { tone: "warn", text: "확인 필요" };
    return L.pill(L.evaluate(m.parsed, state.jobs, now()).status);
  }
  function renderInbox() {
    var items = state.inbox;
    $("inbox").innerHTML = items.length ? items.map(function (m) {
      var p = itemPill(m);
      return '<button type="button" class="sms' + (cur && cur.msgId === m.id ? " is-active" : "") + (m.status === "done" ? " is-done" : "") + '" data-id="' + esc(m.id) + '">' +
        '<div class="sms-top"><span class="sms-from">' + esc(m.source === "manual" ? "직접 입력" : (m.from || "번호 없음")) + '</span><span class="sms-time">' + esc(String(m.receivedAt).slice(5).replace("-", "/")) + "</span>" +
        '<span class="pill pill-' + p.tone + '">' + esc(p.text) + "</span></div>" +
        '<p class="sms-body">' + esc(m.text) + "</p></button>";
    }).join("") : '<div class="sheet-empty" style="background:var(--surface);border:1px solid var(--line);border-radius:14px">아직 들어온 문의가 없어요.<br>문자 전달 앱이 연결되면 손님 문자가 여기에 자동으로 떠요.</div>';
    var pending = items.filter(function (m) { return m.status === "new"; }).length;
    $("inboxCount").textContent = pending ? " " + pending : "";
  }

  function renderSettings() {
    var s = state.settings, h = "<h2>알림 · AI 설정</h2><ol>";
    if (s.kakao) h += '<li>카카오톡 알림 켜짐<span>새 문의가 오면 카카오톡 \'나와의 채팅\'으로 알려줘요.</span><button type="button" class="btn" id="testKakao" style="margin-top:6px">테스트 알림 보내기</button></li>';
    else if (s.kakaoReady) h += '<li>카카오톡 알림이 아직 연결 안 됐어요<span>아빠 카카오 계정으로 한 번만 로그인하면 돼요.</span><a class="btn btn-primary" style="margin-top:6px;display:inline-block" href="' + esc(APP_URL + "?key=" + KEY + "&kakao=login") + '" target="_top">카카오톡 연결하기</a></li>';
    else h += "<li>카카오톡 알림 꺼짐<span>설명서의 '카카오톡 알림' 단계를 하면 켜져요.</span></li>";
    h += s.ai ? "<li>AI로 문자 읽는 중<span>" + esc(s.aiModel) + " · 문자 한 통마다 사용료가 조금 들어요.</span></li>"
      : "<li>무료 규칙으로 문자 읽는 중<span>사용료 0원. 날짜를 잘 못 읽으면 결과 화면에서 고칠 수 있어요.</span></li>";
    $("settings").innerHTML = h + "</ol>";
  }

  // ---------- 주간 달력 ----------
  function weekMon(k) { return key(L.mondayOf(fromKey(k))); }
  function weekRange(mk) {
    var a = fromKey(mk), b = addDays(a, 5);
    return (a.getMonth() + 1) + "월 " + a.getDate() + "일 – " + (a.getMonth() === b.getMonth() ? "" : (b.getMonth() + 1) + "월 ") + b.getDate() + "일";
  }
  function weekGrid(mk, o) {
    o = o || {};
    var mon = fromKey(mk), tk = tkey(), days = [];
    for (var i = 0; i < 7; i++) days.push(key(addDays(mon, i)));
    days = days.filter(function (k) { return !L.isClosed(k) || dayJobs(k).length || (o.prop && o.prop.date === k); });
    var cols = "26px repeat(" + days.length + ", minmax(0, 1fr))";
    var y = function (m) { return (Math.max(OPEN, Math.min(CLOSE, m)) - OPEN) / 60 * HR; };
    var hgt = function (s, d) { return Math.max(18, y(s + d) - y(s)).toFixed(1); };
    var hours = (CLOSE - OPEN) / 60;
    var h = '<div class="wk" style="--hours:' + hours + '"><div class="wk-head" style="grid-template-columns:' + cols + '"><span></span>';
    days.forEach(function (k) {
      var d = fromKey(k), n = dayJobs(k).length;
      h += '<div class="wk-dh' + (k === tk ? " is-today" : "") + (k < tk ? " is-past" : "") + '">' + DOW[d.getDay()] + "<b>" + d.getDate() + '</b><span class="wk-n">' + (n ? n + "건" : "&nbsp;") + "</span></div>";
    });
    h += '</div><div class="wk-body" style="grid-template-columns:' + cols + '"><div class="wk-axis" aria-hidden="true">';
    for (var t = OPEN; t <= CLOSE; t += 60) h += '<span style="top:' + y(t) + 'px">' + (t / 60) + "</span>";
    h += "</div>";
    days.forEach(function (k) {
      h += '<div class="wk-col' + (k < tk ? " is-past" : "") + (L.isClosed(k) ? " is-off" : "") + (o.pick ? " pickable" : "") + '" data-date="' + k + '">';
      dayJobs(k).forEach(function (j) {
        var s = j.fullDay ? FULL_START : j.start, d = j.fullDay ? FULL_DUR : j.dur;
        h += '<button type="button" class="ev' + (/^에어컨/.test(j.label) ? "" : " home") + ((o.hits || []).indexOf(j.id) >= 0 ? " hit" : "") + (o.selId === j.id ? " is-sel" : "") +
          '" data-job="' + esc(j.id) + '" style="top:' + y(s) + "px;height:" + hgt(s, d) + 'px" aria-label="' + esc(fmtDate(k) + " " + fmtTime(s) + " " + (j.customer || "") + " " + j.label) + '">' +
          '<span class="ev-t">' + (j.fullDay ? "종일" : hm(s)) + '</span><span class="ev-n">' + esc(j.customer || "고객") + '</span><span class="ev-l">' + esc(shortLabel(j.label)) + "</span></button>";
      });
      if (o.prop && o.prop.date === k) {
        var p = o.prop;
        h += '<div class="ev prop' + (p.bad ? " bad" : "") + '" style="top:' + y(p.start) + "px;height:" + hgt(p.start, p.dur) + 'px"><span class="ev-t">' + (p.full ? "종일" : hm(p.start)) + '</span><span class="ev-n">' + (p.bad ? "요청" : "새 예약") + "</span></div>";
      }
      if (k === tk) { var nm = L.minsOf(now()); if (nm > OPEN && nm < CLOSE) h += '<span class="wk-now" style="top:' + y(nm) + 'px"></span>'; }
      h += "</div>";
    });
    return h + "</div></div>";
  }

  // ---------- 확인 결과 ----------
  var ICON_BAD = '<svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>';
  var ICON_OK = '<svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>';
  var EMPTY_RESULT = '<div class="sheet-empty">문의를 누르면 날짜·시간·작업을 읽고<br>일정표와 겹치는지 알려줘요.</div>';

  function renderResult(fresh) {
    var box = $("result");
    if (!cur) { box.innerHTML = EMPTY_RESULT; return; }
    var bad = ev.status !== "ok" && ev.status !== "suggest", h = "", title, text, cls;
    if (added) { cls = "ok"; title = "일정표에 넣었어요"; text = whenText(sel.date, sel.start, cur.full) + " · " + esc(cur.label); }
    else if (ev.status === "ok") { cls = "ok"; title = "이 시간 비어 있어요"; text = whenText(cur.date, ev.start, cur.full) + "에 넣을 수 있어요."; }
    else if (ev.status === "suggest") { cls = "ok"; title = "빈 시간을 찾았어요"; text = "고객 요청(" + esc(cur.timeText || "시간 무관") + ")에 맞춰 " + fmtDate(cur.date) + " " + fmtTime(ev.start) + " 시작을 추천해요."; }
    else if (ev.status === "conflict") {
      cls = ""; title = "일정이 겹쳐요";
      text = ev.windowFull ? fmtDate(cur.date) + " " + esc(cur.timeText) + "에는 넣을 자리가 없어요." : whenText(cur.date, cur.start, cur.full) + " 요청이 기존 예약 " + ev.conflicts.length + "건과 겹쳐요.";
    }
    else if (ev.status === "closed") { cls = "warn"; title = "휴무일이에요"; text = fmtDate(cur.date) + " 요청이에요. 다른 날을 골라 주세요."; }
    else if (ev.status === "outside") { cls = "warn"; title = "작업 시간 밖이에요"; text = fmtTime(cur.start) + " 시작이면 " + fmtTime(cur.start + cur.dur) + "에 끝나요. 작업은 " + fmtTime(OPEN) + "~" + fmtTime(CLOSE) + "예요."; }
    else if (ev.status === "past") { cls = "warn"; title = "이미 지난 시간이에요"; text = "날짜를 다시 확인해 주세요."; }
    else { cls = "warn"; title = "날짜를 못 찾았어요"; text = "아래에서 날짜를 직접 골라 주세요."; }
    h += '<div class="alert ' + cls + '" role="status">' + (cls === "ok" ? ICON_OK : ICON_BAD) + '<div><div class="alert-title">' + title + '</div><div class="alert-text">' + text + "</div></div></div>";
    h += '<div class="sheet-body"><blockquote class="quote">' + esc(cur.text) + "</blockquote>";

    var durOpts = [60, 90, 120, 150, 180, 240, 300, 360];
    if (!cur.full && durOpts.indexOf(cur.dur) < 0) { durOpts.push(cur.dur); durOpts.sort(function (a, b) { return a - b; }); }
    var dis = added ? " disabled" : "";
    h += '<div><p class="section-label">문자에서 읽은 내용' + (cur.via === "ai" ? " · AI" : "") + '</p><dl class="fields">';
    h += '<dt><label for="fDate">날짜</label></dt><dd><input type="date" id="fDate" value="' + (cur.date || "") + '"' + dis + ">" + (cur.dateText ? ' <span class="hint">“' + esc(cur.dateText) + '”</span>' : "") + "</dd>";
    h += '<dt><label for="fTime">시간</label></dt><dd>' + (cur.full ? "하루 종일" :
      '<input type="time" id="fTime" step="1800" value="' + (cur.start != null ? hm(cur.start) : "") + '"' + dis + ">" + (cur.start == null ? ' <span class="hint">' + (cur.timeText ? "“" + esc(cur.timeText) + "” → 빈 시간 자동 선택" : "시간 언급 없음 → 빈 시간 자동 선택") + "</span>" : "")) + "</dd>";
    h += '<dt><label for="fLabel">작업</label></dt><dd><input type="text" id="fLabel" value="' + esc(cur.label) + '"' + dis + "></dd>";
    h += '<dt><label for="fDur">예상 소요</label></dt><dd>' + (cur.full ? "하루 종일" :
      '<select id="fDur"' + dis + ">" + durOpts.map(function (d) { return '<option value="' + d + '"' + (d === cur.dur ? " selected" : "") + ">" + fmtDur(d) + "</option>"; }).join("") + "</select>") + "</dd>";
    h += '<dt><label for="fName">고객</label></dt><dd><input type="text" id="fName" value="' + esc(cur.customer) + '" placeholder="이름 없음"' + dis + "></dd>";
    h += '<dt><label for="fPhone">연락처</label></dt><dd><input type="tel" id="fPhone" value="' + esc(cur.phone) + '"' + dis + "></dd>";
    h += '<dt><label for="fAddr">주소</label></dt><dd><input type="text" id="fAddr" value="' + esc(cur.address) + '" placeholder="주소 없음 · 답장에서 물어보세요"' + dis + "></dd>";
    h += "</dl></div>";

    if (cur.date) {
      var pdur = cur.full ? FULL_DUR : cur.dur;
      var prop = sel ? { date: sel.date, start: sel.start, dur: pdur, full: cur.full }
        : (cur.start != null && ev.status !== "nodate" ? { date: cur.date, start: cur.start, dur: pdur, full: cur.full, bad: true } : null);
      var focus = sel ? sel.date : cur.date;
      h += '<div><p class="section-label">' + weekRange(weekMon(focus)) + " 주간 일정</p>" +
        weekGrid(weekMon(focus), { prop: added ? null : prop, hits: added ? [] : ev.conflicts.map(function (j) { return j.id; }), pick: !added });
      h += '<div class="legend" style="margin-top:8px"><span><i style="background:var(--c-ac)"></i>기존 예약</span>' + (prop && !added ? '<span><i style="background:' + (prop.bad ? "var(--bad)" : "var(--ok)") + '"></i>' + (prop.bad ? "요청한 시간" : "넣을 시간") + "</span>" : "") + "<span>이동시간 " + L.BUF + "분 포함</span></div>";
      if (!added) h += '<p class="hint" style="margin:4px 0 0">달력의 빈 칸을 누르면 그 시간으로 다시 확인해요.</p>';
      if (ev.conflicts.length && !added) {
        h += '<ul class="conflict-list" style="margin-top:10px">' + ev.conflicts.map(function (j) {
          return '<li><b class="num">' + (j.fullDay ? "종일" : hm(j.start) + "–" + hm(j.start + j.dur)) + "</b> " + esc(j.label) + '<br><span class="hint">' + esc(j.customer) + " · " + esc(j.address) + "</span></li>";
        }).join("") + "</ul>";
      }
      h += "</div>";
    }

    if (bad && ev.alts.length && !added) {
      h += '<div><p class="section-label">대신 가능한 시간</p><div class="alts">' + ev.alts.map(function (a, i) {
        var on = sel && sel.date === a.date && sel.start === a.start;
        var why = a.sameDay ? "같은 날 다른 시간" : (cur.full ? "그날 예약 없음" : (cur.start != null && a.start === cur.start ? "같은 시간, 다른 날" : "가장 가까운 빈 시간"));
        return '<button type="button" class="alt" data-alt="' + i + '" aria-pressed="' + (on ? "true" : "false") + '"><span><span class="alt-date">' + whenText(a.date, a.start, cur.full) + '</span><br><span class="alt-why">' + why + '</span></span><span class="alt-mark"></span></button>';
      }).join("") + "</div></div>";
    }

    if (!added && sel) h += '<button type="button" class="btn btn-primary" id="addBtn">' + whenText(sel.date, sel.start, cur.full) + " 일정표에 넣기</button>";
    else if (!added && bad && ev.alts.length) h += '<p class="hint" style="margin:0">위에서 시간을 고르면 일정표에 바로 넣을 수 있어요. 고객에게 먼저 물어보려면 아래 답장을 보내세요.</p>';

    var reply = L.replyText(cur, ev, sel, added);
    h += '<div><p class="section-label"><label for="replyText">고객에게 보낼 답장</label></p><textarea class="reply" id="replyText">' + esc(reply) + "</textarea>";
    h += '<div class="row" style="margin-top:8px"><button type="button" class="btn btn-grow" id="copyBtn">답장 복사</button>';
    if (cur.phone) h += '<a class="btn btn-grow" id="smsLink" target="_top" href="sms:' + esc(cur.phone) + "?body=" + encodeURIComponent(reply) + '">문자앱 열기</a>';
    h += "</div>" + (cur.phone ? '<p class="phone-line">받는 사람 <span class="num">' + esc(cur.phone) + '</span> · <a href="tel:' + esc(cur.phone) + '" target="_top">전화 걸기</a></p>' : "") + "</div>";
    h += '<button type="button" class="btn" id="dismissBtn" style="align-self:center">' + (armedDismiss ? "정말 목록에서 지울까요?" : "목록에서 지우기") + "</button>";
    h += "</div>";
    box.innerHTML = h;
    box.classList.remove("fresh"); if (fresh) { void box.offsetWidth; box.classList.add("fresh"); }
  }

  function reevaluate(fresh) {
    ev = L.evaluate(cur, state.jobs, now());
    if (!added) sel = (ev.status === "ok" || ev.status === "suggest") ? { date: cur.date, start: ev.start } : null;
    renderInbox(); renderResult(fresh);
  }

  function openItem(id, scroll) {
    var m = state.inbox.filter(function (x) { return x.id === id; })[0];
    if (!m) return;
    var p = m.parsed || L.parse(m.text, now());
    cur = JSON.parse(JSON.stringify(p)); cur.text = m.text; cur.msgId = m.id;
    if (!cur.phone && /^\+?\d[\d-]{7,}$/.test(m.from || "")) cur.phone = m.from;
    sel = null; added = m.status === "done"; armedDismiss = false;
    if (added) {
      var j = state.jobs.filter(function (x) { return x.inboxId === m.id; })[0];
      sel = j ? { date: j.date, start: j.start } : (cur.date ? { date: cur.date, start: cur.start || 540 } : null);
      if (!sel) added = false; else { cur.date = sel.date; if (!cur.full) cur.start = sel.start; }
    }
    reevaluate(true);
    if (scroll) $("resultAnchor").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ---------- 일정표 탭 ----------
  var viewMon = null, selJob = null;
  function defaultMon() { var T = today0(), m = L.mondayOf(T); if (T.getDay() === 0) m = addDays(m, 7); return key(m); }
  function renderSched() {
    if (!viewMon) viewMon = defaultMon();
    var mon = fromKey(viewMon), endK = key(addDays(mon, 6)), tk = tkey();
    var wj = state.jobs.filter(function (j) { return j.date >= viewMon && j.date <= endK; });
    var busyMin = wj.reduce(function (s, j) { return s + (j.fullDay ? FULL_DUR : j.dur); }, 0), free = 0;
    for (var i = 0; i < 7; i++) { var k = key(addDays(mon, i)); if (k >= tk && !L.isClosed(k) && !dayJobs(k).length) free++; }
    var diff = Math.round((mon - fromKey(defaultMon())) / 6048e5);
    $("wkRange").textContent = weekRange(viewMon);
    $("wkSub").textContent = diff === 0 ? "이번 주" : diff === 1 ? "다음 주" : diff === -1 ? "지난 주" : diff > 0 ? diff + "주 뒤" : -diff + "주 전";
    $("schedSummary").innerHTML =
      '<div class="stat"><b>' + wj.length + "</b><span>예약</span></div>" +
      '<div class="stat"><b>' + (busyMin ? (busyMin / 60).toFixed(busyMin % 60 ? 1 : 0) : 0) + "</b><span>작업 시간</span></div>" +
      '<div class="stat"><b>' + free + "</b><span>남은 빈 날</span></div>";
    $("wkGrid").innerHTML = weekGrid(viewMon, { selId: selJob });
    var j = state.jobs.filter(function (x) { return x.id === selJob; })[0];
    $("wkDetail").innerHTML = j ?
      '<div class="detail"><div class="detail-top"><span class="detail-when">' + fmtDate(j.date) + " · " + (j.fullDay ? "하루 종일" : '<span class="num">' + hm(j.start) + "–" + hm(j.start + j.dur) + "</span>") + "</span>" +
      '<button type="button" class="job-del' + (armedDel === j.id ? " armed" : "") + '" data-del="' + esc(j.id) + '">' + (armedDel === j.id ? "정말 삭제" : "삭제") + "</button></div>" +
      "<div>" + esc(j.label) + '</div><div class="job-who">' + esc(j.customer || "이름 없음") +
      (j.phone ? ' · <a class="num" href="tel:' + esc(j.phone) + '" target="_top">' + esc(j.phone) + "</a>" : "") + (j.address ? "<br>" + esc(j.address) : "") + "</div></div>"
      : '<p class="hint" style="margin:0;text-align:center">일정을 누르면 고객 정보가 여기 나와요.</p>';
    $("jobCount").textContent = " " + state.jobs.filter(function (x) { return x.date >= tk; }).length;
  }

  function applyState(s) {
    state = s;
    if (cur && !state.inbox.some(function (m) { return m.id === cur.msgId; })) cur = null;
    renderInbox(); renderSched(); renderSettings();
    if (cur) reevaluate(false); else renderResult(false);
  }

  // ---------- 이벤트 ----------
  function showView(v) {
    $("view-inbox").hidden = v !== "inbox"; $("view-sched").hidden = v !== "sched";
    $("tab-inbox").setAttribute("aria-selected", v === "inbox"); $("tab-sched").setAttribute("aria-selected", v === "sched");
    if (v === "sched") renderSched();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(function (b) { b.addEventListener("click", function () { showView(b.dataset.view); }); });

  $("refreshBtn").addEventListener("click", function () { run("getState").then(function (s) { applyState(s); toast("새로 불러왔어요"); }); });
  setInterval(function () { if (document.visibilityState === "visible" && !busy) run("getState").then(applyState, function () {}); }, 60000);

  $("inbox").addEventListener("click", function (e) {
    var b = e.target.closest(".sms"); if (b) openItem(b.dataset.id, true);
  });

  $("pasteForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var txt = $("pasteText").value.trim();
    if (!txt) { toast("내용을 적어 주세요"); return; }
    $("pasteBtn").disabled = true; busy = true;
    run("ingestManual", txt).then(function (res) {
      $("pasteText").value = ""; applyState(res.state); openItem(res.id, true);
    }).finally(function () { $("pasteBtn").disabled = false; busy = false; });
  });

  var FIELD = { fDate: "date", fTime: "start", fDur: "dur", fLabel: "label", fName: "customer", fPhone: "phone", fAddr: "address" };
  $("result").addEventListener("change", function (e) {
    if (!cur || added || !FIELD[e.target.id]) return;
    var f = FIELD[e.target.id], v = e.target.value;
    if (f === "date") cur.date = v || null;
    else if (f === "start") { if (v) { var p = v.split(":"); cur.start = +p[0] * 60 + +p[1]; } else cur.start = null; }
    else if (f === "dur") cur.dur = +v;
    else { cur[f] = v; $("replyText").value = L.replyText(cur, ev, sel, added); return; }
    sel = null; reevaluate(false);
  });
  $("result").addEventListener("input", function (e) {
    if (e.target.id === "replyText" && $("smsLink")) $("smsLink").href = "sms:" + cur.phone + "?body=" + encodeURIComponent(e.target.value);
  });
  $("result").addEventListener("click", function (e) {
    if (!cur) return;
    var evb = e.target.closest(".ev[data-job]");
    if (evb) { var jj = state.jobs.filter(function (x) { return x.id === evb.dataset.job; })[0]; if (jj) toast((jj.fullDay ? "종일" : hm(jj.start) + "–" + hm(jj.start + jj.dur)) + " " + (jj.customer || "") + " · " + shortLabel(jj.label)); return; }
    var col = e.target.closest(".wk-col.pickable");
    if (col && !added) {
      var rc = col.getBoundingClientRect(), m = OPEN + Math.floor((e.clientY - rc.top) / HR * 2) * 30;
      cur.date = col.dataset.date;
      if (!cur.full) { cur.start = Math.max(OPEN, Math.min(CLOSE - 30, m)); cur.win = null; }
      sel = null; reevaluate(false);
      toast(fmtDate(cur.date) + (cur.full ? "" : " " + fmtTime(cur.start)) + "로 다시 확인했어요");
      return;
    }
    var a = e.target.closest(".alt");
    if (a && !added) { var alt = ev.alts[+a.dataset.alt]; sel = (sel && sel.date === alt.date && sel.start === alt.start) ? null : { date: alt.date, start: alt.start }; renderResult(false); return; }
    if (e.target.id === "addBtn" && sel && !added) {
      e.target.disabled = true; busy = true;
      var job = { date: sel.date, start: sel.start, dur: cur.full ? FULL_DUR : cur.dur, fullDay: cur.full, label: cur.label, customer: cur.customer, phone: cur.phone, address: cur.address };
      run("addJob", job, cur.msgId).then(function (s) {
        added = true; viewMon = weekMon(sel.date); cur.date = sel.date; if (!cur.full) cur.start = sel.start;
        var mine = s.jobs.filter(function (x) { return x.date === sel.date && x.start === sel.start; });
        selJob = mine.length ? mine[mine.length - 1].id : null;
        applyState(s); toast("일정표에 넣었어요");
      }, function () { e.target.disabled = false; }).finally(function () { busy = false; });
      return;
    }
    if (e.target.id === "dismissBtn") {
      if (!armedDismiss) { armedDismiss = true; renderResult(false); return; }
      run("setInboxStatus", cur.msgId, "dismissed").then(function (s) { cur = null; applyState(s); toast("목록에서 지웠어요"); });
      return;
    }
    if (e.target.id === "copyBtn") {
      var ta = $("replyText"), txt = ta.value;
      var fallback = function () { ta.focus(); ta.select(); toast("길게 눌러 복사해 주세요"); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast("답장을 복사했어요"); }, fallback);
      else fallback();
    }
  });

  $("settings").addEventListener("click", function (e) {
    if (e.target.id !== "testKakao") return;
    e.target.disabled = true;
    run("sendTestKakao").then(function (ok) { toast(ok ? "카카오톡을 확인해 보세요" : "보내지 못했어요. 다시 연결해 주세요."); }).finally(function () { e.target.disabled = false; });
  });

  $("wkGrid").addEventListener("click", function (e) {
    var b = e.target.closest(".ev[data-job]"); if (!b) return;
    selJob = selJob === b.dataset.job ? null : b.dataset.job; armedDel = null; renderSched();
  });
  $("wkDetail").addEventListener("click", function (e) {
    var b = e.target.closest(".job-del"); if (!b) return;
    var id = b.dataset.del;
    if (armedDel !== id) { armedDel = id; renderSched(); return; }
    b.disabled = true;
    run("deleteJob", id).then(function (s) { armedDel = null; selJob = null; applyState(s); toast("일정을 지웠어요"); });
  });
  $("wkPrev").addEventListener("click", function () { viewMon = key(addDays(fromKey(viewMon), -7)); selJob = null; renderSched(); });
  $("wkNext").addEventListener("click", function () { viewMon = key(addDays(fromKey(viewMon), 7)); selJob = null; renderSched(); });
  $("wkToday").addEventListener("click", function () { viewMon = defaultMon(); selJob = null; renderSched(); });

  var T0 = today0();
  $("todayLabel").textContent = "· 오늘 " + (T0.getMonth() + 1) + "월 " + T0.getDate() + "일 " + DOW[T0.getDay()] + "요일";
  renderInbox(); renderSched(); renderSettings();
})();
</script>
</body>
</html>
